name: Deploy website

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://transcribe.lukhausen.de
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Upload website over FTPS
        env:
          HETZNER_FTP_HOST: ${{ vars.HETZNER_FTP_HOST }}
          HETZNER_FTP_DIR: ${{ vars.HETZNER_FTP_DIR }}
          HETZNER_FTP_USER: ${{ secrets.HETZNER_FTP_USER }}
          HETZNER_FTP_PASSWORD: ${{ secrets.HETZNER_FTP_PASSWORD }}
        run: python3 scripts/deployment/upload.py
